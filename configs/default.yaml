# Default configuration for UKAN-CBAM binary segmentation

# Model
model:
  name: "UKAN_CBAM"
  num_classes: 1
  input_channels: 3
  img_size: 224
  patch_size: 16
  embed_dims: [256, 320, 512]
  depths: [1, 1, 1]
  add_cbam: true
  no_kan: false
  drop_rate: 0.1
  drop_path_rate: 0.1

# Dataset
dataset:
  name: "binary_segmentation"
  root_dir: "./data"
  train_split: "train"
  val_split: "val"
  test_split: "test"
  image_size: 224
  batch_size: 8
  num_workers: 4
  pin_memory: true

# Augmentation
augmentation:
  train:
    - type: "Resize"
      height: 224
      width: 224
    - type: "HorizontalFlip"
      p: 0.5
    - type: "VerticalFlip"
      p: 0.5
    - type: "RandomRotate90"
      p: 0.5
    - type: "RandomBrightnessContrast"
      brightness_limit: 0.2
      contrast_limit: 0.2
      p: 0.3
    - type: "HueSaturationValue"
      hue_shift_limit: 20
      sat_shift_limit: 30
      val_shift_limit: 20
      p: 0.3
    - type: "Normalize"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  val:
    - type: "Resize"
      height: 224
      width: 224
    - type: "Normalize"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

# Training
training:
  epochs: 60
  optimizer:
    name: "AdamW"
    lr: 0.001
    weight_decay: 0.01
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 100
    eta_min: 1e-6
  loss:
    name: "DiceBCELoss"
    dice_weight: 0.5
    bce_weight: 0.5
  metrics:
    - "dice"
    - "iou"
    - "precision"
    - "recall"
  early_stopping:
    patience: 20
    min_delta: 0.001
  checkpoint:
    save_dir: "./checkpoints"
    save_top_k: 3
    monitor: "val_dice"
    mode: "max"

# Logging
logging:
  log_dir: "./logs"
  use_wandb: false
  wandb_project: "ukan-cbam"
  tensorboard: true
